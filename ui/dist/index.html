<body>
  <canvas id="gl"></canvas>
  <div id="labels"></div>

  <div id="hud">
    <header class="top">
      <div class="brand"><span class="mark">THE PARADOX BRAIN</span><span class="sub">a quiet engine for hard thoughts</span></div>
      <div class="status"><button id="modeswitch" class="modeswitch" type="button" aria-label="Switch mode"><span class="ms-a">ANSWER</span><i></i><span class="ms-b">RESOLVE</span></button><span id="mode" class="mode"></span><span id="phase" class="phase">BOOT</span></div>
    </header>

    <aside id="trace" class="trace"></aside>
    <aside id="cands" class="cands"></aside>

    <div id="title" class="title"></div>

    <section id="answer" class="answer hidden">
      <div class="answer-meta"><span id="answer-move"></span><span id="answer-cost"></span></div>
      <div id="answer-text" class="answer-text"></div>
      <div id="objection" class="objection hidden"></div>
      <div class="rate" id="rate">
        <span class="rate-label">RATE</span>
        <button data-r="1">✦</button><button data-r="2">✦</button><button data-r="3">✦</button><button data-r="4">✦</button><button data-r="5">✦</button>
        <button id="why" class="why">WHY</button>
      </div>
    </section>

    <form id="ask" class="ask" autocomplete="off">
      <span class="caret">›</span>
      <input id="input" type="text" spellcheck="false" placeholder="State a contradiction." />
      <button type="submit" class="go">ENTER</button>
    </form>

    <div class="sound">
      <button id="mute" class="mute" aria-label="Sound">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="waves" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><path id="cross" d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
      <input id="volume" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="Volume" />
    </div>

    <div id="rz" class="rz">
      <div class="rz-rep a" id="rzrepA"><h5>REPORT A</h5><textarea id="rzA" spellcheck="false" placeholder="Paste a claim or a report, or drop a PDF, Word or text file here"></textarea><div class="rz-file"><button type="button" class="rz-attach" id="rzatA">ATTACH FILE</button><span class="rz-fname" id="rzfnA"></span><input type="file" id="rzinA" accept=".pdf,.docx,.txt,.md" hidden /></div><div class="rzlist" id="rzlA"></div></div>
      <div class="rz-rep b" id="rzrepB"><h5>REPORT B</h5><textarea id="rzB" spellcheck="false" placeholder="Paste a claim or a report, or drop a PDF, Word or text file here"></textarea><div class="rz-file"><button type="button" class="rz-attach" id="rzatB">ATTACH FILE</button><span class="rz-fname" id="rzfnB"></span><input type="file" id="rzinB" accept=".pdf,.docx,.txt,.md" hidden /></div><div class="rzlist" id="rzlB"></div></div>
      <div class="rz-cases" id="rzcases"></div>
      <div class="rz-hint" id="rzhint">Two claims, or two reports. Resolve checks whether they really contradict each other.</div>
      <div class="rz-msg" id="rzmsg"><h3 id="rzmsgh"></h3><p id="rzmsgp"></p></div>
      <div class="rz-verdict" id="rzv"><small>VERDICT</small><h3 id="rzvh"></h3><p id="rzvp"></p></div>
      <div class="rz-ledger" id="rzled"></div>
      <button class="rz-go" id="rzgo" type="button">RESOLVE</button>
    </div>
  </div>
  <div id="flash"></div>
  <div id="dark"></div>
</body>
</html>
